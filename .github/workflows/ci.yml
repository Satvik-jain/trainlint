name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q
      - run: uv run python -m bench

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          uvx --from dist/*.whl trainlint skills install --dest "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/ml-training-loop/SKILL.md"
          uvx --from dist/*.whl trainlint check --exit-zero bench/buggy
