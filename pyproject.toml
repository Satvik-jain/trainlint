[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainlint"
dynamic = ["version"]
description = "Offline checker and agent skills for ML bugs that do not crash: leakage, train/eval mode, loss and metric mistakes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Satvik Jain" }]
keywords = ["machine-learning", "pytorch", "scikit-learn", "linter", "static-analysis", "data-leakage", "agent-skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Satvik-jain/trainlint"
Issues = "https://github.com/Satvik-jain/trainlint/issues"

[project.scripts]
trainlint = "trainlint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.version]
path = "src/trainlint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trainlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bench/cases", "bench/clean"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
